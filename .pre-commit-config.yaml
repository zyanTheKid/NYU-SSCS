repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data.
        entry: trufflehog
        args: ["git", "file://.", "--since-commit", "HEAD", "--no-verification", "--no-update", "--fail"]
        language: system
        pass_filenames: false
        always_run: true
        stages: ["pre-commit", "pre-push"]
